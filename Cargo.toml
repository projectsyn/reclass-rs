[package]
name = "reclass-rs"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["VSHN AG <info@vshn.ch>"]
repository = "https://github.com/projectsyn/reclass-rs"
keywords = ["yaml", "reclass", "hierarchical config"]
description = "Reclass defines a syntax and directory structure for recursively merging YAML data sources."

[lib]
name = "reclass_rs"
# cdylib for pyo3 and rlib for `cargo test`
crate-type = ["cdylib", "rlib"]
# disable benchmarks for the lib crate
bench = false

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
fancy-regex = "0.20.2"
glob = "0.3.4"
indexmap = "2.14.2"
nom = "8.0.0"
nom-language = "0.1.0"
pyo3 = { version = "=0.30.1", features = ["chrono"] }
rayon = "1.12.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
walkdir = "2.5.1"
yaml-merge-keys = { version = "0.9.1", features = ["serde_yaml"] }

[build-dependencies]
rustc_version = "0.4.1"

[dev-dependencies]
criterion = "0.8.2"
paste = "1.0.15"

[features]
bench = []

[[bench]]
name = "inventory_single_threaded"
harness = false
required-features = ["bench"]

[[bench]]
name = "inventory_multi_threaded"
harness = false
required-features = ["bench"]

[[bench]]
name = "render_many_classes"
harness = false
required-features = ["bench"]
